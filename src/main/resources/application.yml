spring:
  application:
    name: user-management-system
  datasource:
    url: ${DB_URL:jdbc:mysql://192.168.128.200:3306/user_management?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Tokyo}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  application:
    name: ${spring.application.name}
    description: 日本IT就職活動向けのユーザー管理・認証学習プロジェクト
