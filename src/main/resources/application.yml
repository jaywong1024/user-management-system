spring:
  application:
    name: user-management-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://192.168.128.200:5432/user_management}
    username: ${DB_USERNAME:user_management_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    user: ${DB_MIGRATION_USERNAME:user_management_migration}
    password: ${DB_MIGRATION_PASSWORD}
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  application:
    name: ${spring.application.name}
    description: 日本IT就職活動向けのユーザー管理・認証学習プロジェクト
